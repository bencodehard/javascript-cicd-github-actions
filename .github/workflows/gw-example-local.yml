name: CI/CD Local Mac (self-hosted)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: simple-users-management-nodejs
  CONTAINER_NAME: simple-users-management-nodejs
  APP_PORT: 3000
  DOCKER_VOLUMES: ""

jobs:
  SonarQube:
    name: Run SonarQube Analysis
    runs-on: [self-hosted, mac-localhost]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build Docker image
    runs-on: [self-hosted, mac-localhost]
    needs: SonarQube
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} \
            -t ${IMAGE_NAME}:latest \
            -t ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest \
            -t ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${{ github.sha }} \
            .
            
      - name: Disable Docker Credential Helper
        run: |
          mkdir -p /tmp/.docker
          echo '{"credsStore": ""}' > /tmp/.docker/config.json

      - name: Manual Login to GHCR
        run: |
          export DOCKER_CONFIG=/tmp/.docker
          mkdir -p $DOCKER_CONFIG
          echo '{"credsStore": ""}' > $DOCKER_CONFIG/config.json
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        env:
          DOCKER_CONFIG: /tmp/.docker 
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest
          docker push ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:${{ github.sha }}

  test:
    name: Run unit tests
    runs-on: [self-hosted, mac-localhost]
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run tests via Docker
        run: |
          docker build \
            --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --target test \
            -t ${IMAGE_NAME}:test \
            .

  deploy:
    name: Deploy container on local Mac
    runs-on: [self-hosted, mac-localhost]
    needs: [build, test]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Disable Docker Credential Helper
        run: |
          mkdir -p /tmp/.docker
          echo '{"credsStore": ""}' > /tmp/.docker/config.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
          logout: false
        env:
          DOCKER_CONFIG: /tmp/.docker

      - name: Pull image from GHCR
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest
          docker tag ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest ${IMAGE_NAME}:latest

      - name: Stop and remove existing container
        run: |
          if [ "$(docker ps -aq -f name=${CONTAINER_NAME})" ]; then
            echo "Stopping and removing existing container..."
            docker stop ${CONTAINER_NAME} || true
            docker rm -f ${CONTAINER_NAME}
          else
            echo "No existing container found."
          fi

      - name: Run container
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          DOCKER_VOLUMES: ${{ env.DOCKER_VOLUMES }}
          REAL_DATABASE_URL: ${{ secrets.DATABASE_URL }} 
        run: |
          docker run -d \
            --name ${CONTAINER_NAME} \
            --restart always \
            -e DATABASE_URL="$REAL_DATABASE_URL" \
            --env-file .env.example \
            -p ${APP_PORT}:3000 \
            ${DOCKER_VOLUMES} \
            ${IMAGE_NAME}:latest